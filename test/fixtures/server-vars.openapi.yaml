openapi: 3.0.3
info:
  title: Server Variables API
  version: 1.0.0
servers:
  # Every placeholder has a declared default (as OpenAPI requires).
  #
  # `protocol` defaults to http, not https, deliberately: this mirrors the real GitHub Enterprise
  # Server description, which is the spec that motivated substitution in the first place. It also
  # makes the test stronger — with an https default, a bug that hard-coded "https" would still
  # pass. The parser must use whatever the spec declares, however unwise that default is, and the
  # emitted .env.example surfaces the enum so the reader can see https is permitted.
  - url: "{protocol}://{hostname}/api/v3"
    variables:
      hostname:
        description: Self-hosted hostname
        default: HOSTNAME
      protocol:
        description: Self-hosted protocol
        default: http
        enum: [http, https]
  # A variable the spec never declares: the placeholder must survive untouched.
  - url: "https://{region}.example.com/{undeclared}"
    variables:
      region:
        default: eu-west-1
  # No variables block at all: untouched.
  - url: "https://static.example.com/v1"
paths:
  /ping:
    get:
      operationId: ping
      summary: Ping
      responses:
        "200":
          description: ok
